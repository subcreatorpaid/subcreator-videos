}

  --money: #5DBB86; --money-soft: #1D3226; --deny: #E57373; --deny-soft: #3A2120; --busy: #E0A84A; --busy-soft: #3A2F1A; color-scheme: dark } }

  --paper: #121311; --card: #1B1C1A; --ink: #F1F0EB; --muted: #9C9A93; --line: #2E2F2B;
  --money: #5DBB86; --money-soft: #1D3226; --deny: #E57373; --deny-soft: #3A2120; --busy: #E0A84A; --busy-soft: #3A2F1A; color-scheme: dark }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px;

header { display: grid; gap: 10px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }

.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: flex; border: 2px solid var(--ink); border-radius: 12px; overflow: hidden; background: var(--card); }
.seg button { border: 0; background: none; color: var(--ink); font: 700 13px var(--sans); padding: 9px 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
#q { flex: 1 1 200px; min-width: 0; font: 600 14px var(--sans); padding: 10px 14px; border-radius: 12px; border: 2px solid var(--ink); background: var(--card); color: var(--ink); }
.note { font-size: 13px; color: var(--muted); line-height: 1.5; }
.note b { color: var(--ink); }
.group { font: 800 12px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
.list { display: grid; gap: 10px; }
.row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 14px; align-items: center; background: var(--card); border: 2px solid var(--ink); border-radius: 16px; padding: 12px 14px; box-shadow: 4px 4px 0 var(--ink); }
.num { font: 700 22px var(--mono); text-align: center; font-variant-numeric: tabular-nums; }
.info { min-width: 0; display: grid; gap: 6px; }
.title { font-weight: 800; font-size: 16px; line-height: 1.25; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.pill { font: 700 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; border: 1.5px solid var(--line); color: var(--muted); }
.st { border: 0; }
.st.ready { background: var(--line); color: var(--ink); }
.st.done { background: var(--money-soft); color: var(--money); }
.st.busy { background: var(--busy-soft); color: var(--busy); }
.st.fail { background: var(--deny-soft); color: var(--deny); }
.links { display: flex; gap: 12px; flex-wrap: wrap; }
.links a { color: var(--ink); font-weight: 700; font-size: 12px; }
.act { min-width: 0; display: grid; gap: 6px; justify-items: end; }
.btn { box-sizing: border-box; font: 800 14px var(--sans); border-radius: 12px; padding: 10px 18px; cursor: pointer; border: 2px solid var(--ink); background: var(--ink); color: var(--paper); white-space: nowrap; }
.btn.ghost { background: var(--card); color: var(--ink); font-size: 12px; padding: 6px 12px; }
.btn.go { background: var(--money); border-color: var(--money); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
a.btn { display: inline-block; text-decoration: none; text-align: center; }
.sel { user-select: all; overflow-wrap: anywhere; }
.btn:focus-visible, .seg button:focus-visible, #q:focus-visible, .links a:focus-visible { outline: 3px solid var(--money); outline-offset: 2px; }
.confirm { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; font-size: 12px; font-weight: 700; }
.msg { font-size: 12px; font-weight: 600; max-width: 240px; text-align: right; line-height: 1.35; }
.msg.err { color: var(--deny); } .msg.ok { color: var(--money); }
.empty { text-align: center; color: var(--muted); padding: 30px; }

  .msg { max-width: none; text-align: left; }

@media (prefers-reduced-motion: no-preference) { .row { transition: transform .12s, box-shadow .12s; } .row:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); } }
</style>

<div class="wrap">
  <header>
    <div class="brand"><span class="dot">$</span>Sub-Creator Paid</div>
    <h1>Render Room</h1>
    <p class="lede">Every video has its own Render button. Press it, confirm, and GitHub makes the video, 3 hook clips and the thumbnail in about 8 minutes. Nothing is posted anywhere.</p>
    <div class="tally" id="tally"></div>
  </header>
  <div class="bar">
    <div class="seg" role="group" aria-label="Show">
      <button type="button" id="f-all" data-f="all" aria-pressed="true">All</button>
      <button type="button" id="f-todo" data-f="todo" aria-pressed="false">Not rendered</button>
      <button type="button" id="f-done" data-f="done" aria-pressed="false">Rendered</button>
    </div>
    <input id="q" type="search" placeholder="Search by number, title or tool" aria-label="Search videos">
  </div>
  <div class="note" id="conn">Connecting to GitHub to read live render status…</div>
  <div id="list"></div>
</div>

", "slug": "v096_tax_forms_basics", "title": "The tax form every creator platform asks for", "type": "value", "seconds": 39, "group": "plan", "tool_name": "Kit", "rendered": false}, {"n": "097", "slug": "v097_first_100_plan", "title": "A plan for your first $100 online", "type": "value", "seconds": 37, "group": "plan", "tool_name": "Fiverr", "rendered": false}, {"n": "098", "slug": "v098_fiverr_affiliate", "title": "Earn from Fiverr without selling a gig", "type": "tool", "seconds": 37, "group": "plan", "tool_name": "Fiverr", "rendered": false}, {"n": "099", "slug": "v099_money_mistakes", "title": "5 money mistakes small creators make", "type": "value", "seconds": 40, "group": "plan", "tool_name": "Kit", "rendered": false}, {"n": "100", "slug": "v100_proof_recap", "title": "Proof recap: the numbers behind this channel", "type": "proof", "seconds": 43, "group": "plan", "tool_name": "beehiiv", "rendered": false}, {"n": "B1", "slug": "b1_who_we_are", "title": "Who we are: Sub-Creator Paid", "type": "bio", "seconds": 61, "group": "bio", "tool_name": null, "rendered": true}, {"n": "B2", "slug": "b2_the_website", "title": "The free website: subcreatorpaid.com", "type": "bio", "seconds": 54, "group": "bio", "tool_name": null, "rendered": true}, {"n": "B3", "slug": "b3_ai_income_finder", "title": "Meet the free AI Income Finder", "type": "bio", "seconds": 59, "group": "bio", "tool_name": null, "rendered": true}, {"n": "B4", "slug": "b4_what_to_expect", "title": "What you get when you follow", "type": "bio", "seconds": 56, "group": "bio", "tool_name": null, "rendered": true}, {"n": "T1", "slug": "t1_finder_tutorial", "title": "How to use the AI Income Finder (step by step)", "type": "tutorial", "seconds": 102, "group": "tutorial", "tool_name": null, "rendered": true}];
const BUILT = "26 Oct 13:40 UTC";
const OWNER = "subcreatorpaid", REPO = "subcreator-videos", GH = "github";
const WF = `https://github.com/${OWNER}/${REPO}/actions/workflows/animate.yml`;
const TYPE = {value: "Value", tool: "Tool", proof: "Proof", bio: "Bio", tutorial: "Tutorial"};
const runs = {};            // slug -> latest run {status, conclusion, mode, url, at}
const local = {};           // slug -> {phase: 'confirm'|'sending'|'sent'|'error', mode, msg}
let mcp = null, linkMode = false, filter = "all", q = "";
try { filter = localStorage.getItem("rr-filter") || "all"; } catch (e) {}

function state(v) {
  const r = runs[v.slug];
  if (r && r.mode === "full" && r.status !== "completed") return ["busy", "Rendering"];
  if (r && r.mode === "stills" && r.status !== "completed") return ["busy", "Making stills"];
  if (local[v.slug] && local[v.slug].phase === "sent") return ["busy", "Starting"];
  if (r && r.mode === "full" && r.conclusion === "success") return ["done", "Rendered"];
  if (v.rendered) return ["done", "Rendered"];
  if (r && r.mode === "full" && r.conclusion && r.conclusion !== "success") return ["fail", "Last render failed"];
  return ["ready", "Ready to render"];
}
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

function row(v) {
  const [cls, label] = state(v); const L = local[v.slug] || {};
  const done = cls === "done", busy = cls === "busy";
  let act;
  if (L.phase === "confirm") {
    act = `<div class="confirm"><span>${L.mode === "full" ? "Render the full video?" : "Make preview stills?"}</span>
      <button class="btn go" data-do="send" data-slug="${v.slug}">Yes, ${L.mode === "full" ? "render" : "make stills"}</button>
      <button class="btn ghost" data-do="cancel" data-slug="${v.slug}">Cancel</button></div>`;
  } else if (linkMode || L.phase === "fallback") {  // no live GitHub connection, or the one-tap call failed: real links (pop-ups are blocked in artifacts) + copy the video name
    act = `<a class="btn" href="${WF}" target="_blank" rel="noopener">Render on GitHub</a>
      <button class="btn ghost" data-do="copy" data-slug="${v.slug}">${L.copied ? "Copied" : "Copy video name"}</button>
      <div class="msg ok">Run workflow → video: <b class="sel">${esc(v.slug)}</b> → mode: full</div>`;
  } else {
    act = `<button class="btn" data-do="ask" data-mode="full" data-slug="${v.slug}" ${busy || L.phase === "sending" ? "disabled" : ""}>${L.phase === "sending" ? "Sending…" : done ? "Render again" : "Render"}</button>
      <button class="btn ghost" data-do="ask" data-mode="stills" data-slug="${v.slug}" ${busy || L.phase === "sending" ? "disabled" : ""}>Preview stills</button>`;
  }
  const msg = L.msg ? `<div class="msg ${L.phase === "error" ? "err" : "ok"}">${L.msg}</div>` : "";
  const r = runs[v.slug];
  return `<div class="row" id="v-${v.n}">
    <div class="num">${esc(v.n)}</div>
    <div class="info">
      <div class="title">${esc(v.title)}</div>
      <div class="meta"><span class="pill st ${cls}">${label}</span><span class="pill">${TYPE[v.type] || esc(v.type)}</span><span>~${v.seconds} s</span>${v.tool_name ? `<span>· ${esc(v.tool_name)}</span>` : ""}</div>
      <div class="links">
        <a href="https://github.com/${OWNER}/${REPO}/tree/main/videos/${v.slug}" target="_blank" rel="noopener">Files</a>
        ${done ? `<a href="https://github.com/${OWNER}/${REPO}/releases/tag/video-${v.slug}-animated" target="_blank" rel="noopener">Download video</a>` : ""}
        ${r ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">Last run</a>` : ""}
      </div>
    </div>
    <div class="act">${act}${msg}</div>
  </div>`;
}

function render() {
  const groups = [["earlier", "Made earlier"], ["plan", "The 100-video plan"], ["bio", "Bio videos"], ["tutorial", "AI Income Finder tutorial"]];
  const qq = q.trim().toLowerCase();
  const shown = DATA.filter((v) => {
    const c = state(v)[0];
    if (filter === "done" && c !== "done") return false;
    if (filter === "todo" && c === "done") return false;
    return !qq || `${v.n} ${v.title} ${v.tool_name || ""} ${v.slug}`.toLowerCase().includes(qq);
  });
  let html = "";
  for (const [g, name] of groups) {
    const vs = shown.filter((v) => (v.group || "plan") === g);
    if (vs.length) html += `<div class="group">${name} · ${vs.length}</div><div class="list">${vs.map(row).join("")}</div>`;
  }
  document.getElementById("list").innerHTML = html || `<div class="empty">No videos match. Clear the search or pick All.</div>`;
  const c = {done: 0, busy: 0, ready: 0, fail: 0}; DATA.forEach((v) => c[state(v)[0]]++);
  document.getElementById("tally").innerHTML = `<span>${DATA.length} videos</span><span>${c.done} rendered</span><span>${c.busy} rendering</span><span>${c.ready + c.fail} to render</span>`;
  document.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.f === filter)));
}

function selectName(slug) {  // clipboard refused: select the name so it can be copied by hand
  const el = [...document.querySelectorAll(".sel")].find((x) => x.textContent === slug); if (!el) return;
  const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}
function noMcp(text) {
  mcp = null; linkMode = true; render();
  document.getElementById("conn").innerHTML = `${text} Each video now has a <b>Render on GitHub</b> link: press <b>Run workflow</b>, paste the video name, pick <b>full</b>. <a href="${WF}" target="_blank" rel="noopener">Open GitHub</a>`;
}

async function send(slug, mode) {
  const v = DATA.find((x) => x.slug === slug);
  if (!mcp) { local[slug] = {phase: "error", msg: `Open GitHub > Run workflow > video: ${slug}, mode: ${mode}`}; render(); return; }
  local[slug] = {phase: "sending", mode}; render();
  try {
    await mcp.callTool(GH, "actions_run_trigger", {method: "run_workflow", owner: OWNER, repo: REPO, workflow_id: "animate.yml", ref: "main", inputs: {video: slug, mode}});
    local[slug] = {phase: "sent", mode, msg: mode === "full" ? `Render of ${v.n} started. About 8 minutes.` : `Stills for ${v.n} started. About 3 minutes.`};
    setTimeout(() => mcp.invalidate(GH, "actions_list").catch(() => {}), 8000);
  } catch (e) {
    const m = {
      needs_reauth: "GitHub sign-in expired. Reconnect GitHub in claude.ai Settings > Connectors, then press Render again.",
      server_not_connected: "GitHub isn't connected for you. Add it in claude.ai Settings > Connectors.",
      not_in_manifest: "GitHub access was declined for this page. Allow it in the page's connector settings.",
      blocked_by_policy: "Your organization blocks this GitHub action.",
      tool_error: `GitHub refused: ${e.message || "check the repository access"}.`,
    }[e.code] || (e.retryable ? `GitHub didn't answer (${e.code || "timeout"}: ${esc(e.message || "")}). Check Last run before pressing again, so it doesn't render twice.` : `Couldn't start it (${e.code || "error"}: ${esc(e.message || "")}).`);
    // The call may have reached GitHub even though the answer got lost: look for a new run before offering the link.
    const t0 = Date.now() - 60e3; local[slug] = {phase: "sending", mode}; render();
    await new Promise((r) => setTimeout(r, 12000));
    try { await mcp.invalidate(GH, "actions_list"); } catch (x) {}
    await new Promise((r) => setTimeout(r, 4000));
    if (runs[slug] && runs[slug].mode === mode && Date.parse(runs[slug].at) > t0) { local[slug] = {phase: "sent", mode, msg: `Started on GitHub. About ${mode === "full" ? 8 : 3} minutes.`}; render(); return; }
    local[slug] = {phase: "fallback", mode, msg: `${m} Use the GitHub link instead.`};
    if (["not_granted", "not_in_manifest", "server_not_connected", "capability_disabled", "bad_request"].includes(e.code)) { delete local[slug]; noMcp(m); }
  }
  render();
}

document.addEventListener("click", (ev) => {
  const b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.f) { filter = b.dataset.f; try { localStorage.setItem("rr-filter", filter); } catch (e) {} render(); return; }
  const slug = b.dataset.slug; if (!slug) return;
  if (b.dataset.do === "ask") {
    if (!mcp) { local[slug] = {phase: "error", msg: "Still connecting to GitHub. Try again in a few seconds."}; render(); return; }
    local[slug] = {phase: "confirm", mode: b.dataset.mode}; render();
  } else if (b.dataset.do === "copy") {
    const ok = () => { local[slug] = {...(local[slug] || {}), copied: true}; render(); };
    try { navigator.clipboard.writeText(slug).then(ok, () => selectName(slug)); } catch (e) { selectName(slug); }
  } else if (b.dataset.do === "cancel") { delete local[slug]; render(); }
  else if (b.dataset.do === "send") send(slug, local[slug].mode);
});
document.getElementById("q").addEventListener("input", (e) => { q = e.target.value; render(); });

render();

(async () => {
  try { mcp = window.claude && window.claude.use ? await window.claude.use("mcp") : null; } catch (e) { mcp = null; }
  if (!mcp) { noMcp("Live status and one-tap rendering need the GitHub connector."); return; }
  mcp.watchTool(GH, "actions_list", {method: "list_workflow_runs", owner: OWNER, repo: REPO, resource_id: "animate.yml", perPage: 100}, (ev) => {
    if (ev.type === "error") {
      const c = ev.error.code;
      if (["needs_reauth", "server_not_connected", "not_in_manifest", "blocked_by_policy", "approval_required", "not_granted", "capability_disabled"].includes(c)) {
        for (const k in runs) delete runs[k];
        noMcp(c === "needs_reauth" ? "GitHub sign-in expired: reconnect it in claude.ai Settings > Connectors." : c === "server_not_connected" ? "Add GitHub in claude.ai Settings > Connectors for one-tap rendering." : "GitHub access isn't allowed for this page.");
        render();
      } else document.getElementById("conn").textContent = "Couldn't refresh render status just now; showing the last known status.";
      return;
    }
    const p = ev.result.payload || {}; const list = p.workflow_runs || [];
    for (const k in runs) delete runs[k];
    for (const r of list) {
      const m = /^Animate (\S+) \((stills|full)\)$/.exec(r.display_title || "");
      if (!m || runs[m[1]]) continue;  // newest first: keep the latest run per video
      runs[m[1]] = {status: r.status, conclusion: r.conclusion, mode: m[2], url: r.html_url, at: r.created_at};
    }
    for (const s in local) if (local[s].phase === "sent" && runs[s] && runs[s].mode === local[s].mode && Date.parse(runs[s].at) > Date.now() - 3600e3) delete local[s];
    const at = ev.result.cache ? new Date(ev.result.cache.storedAt) : new Date();
    document.getElementById("conn").innerHTML = `Live from GitHub · updated ${at.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"})}. Video list built ${BUILT}.`;
    render();
  }, {refetchInterval: 60000});
})();
</script>
