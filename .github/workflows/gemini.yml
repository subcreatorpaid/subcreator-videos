name: Gemini trend scan

# Cheap daily trend scan on the Gemini API (scripts/gemini_draft.py scan), every day 06:00 UTC or Run workflow.
# Results land on a gemini/<date>-scan branch with a pull request; merging it is the owner's OK. Nothing is posted.
# Scripts, hooks and captions are no longer drafted here: Claude Opus writes them in Claude threads (owner, 30 Oct).
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Trend scan with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/gemini_draft.py scan
      - name: Guard checks
        run: python3 scripts/guard.py --strict
      - name: Open a pull request for review
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: scan
        run: |
          [ -n "$(git status --porcelain)" ] || { echo "nothing new"; exit 0; }
          branch="gemini/$(date -u +%Y-%m-%d)-$JOB-${{ github.run_number }}"
          git config user.name "gemini-drafts[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add brain/
          git commit -m "Gemini $JOB drafts $(date -u +%Y-%m-%d) (needs review)"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" --title "Gemini $JOB $(date -u +%Y-%m-%d) (review)" \
            --body "Drafted by the Gemini API (scripts/gemini_draft.py). Check every figure against its official source and the brand rules before merging. Merging only adds draft files to brain/; nothing is posted." \
            || echo "Could not open the pull request (turn on Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests'). The branch $branch is pushed."
